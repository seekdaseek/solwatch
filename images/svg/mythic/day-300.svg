<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500" viewBox="0 0 500 500">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0d0d1a"/>
    </radialGradient>
    <radialGradient id="gem" cx="40%" cy="35%" r="60%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.9"/>
      <stop offset="40%" style="stop-color:#9B59FF;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#4B1F8E;stop-opacity:1"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="500" height="500" fill="url(#bg)" rx="40"/>
  <circle cx="250" cy="220" r="140" fill="none" stroke="#B57BFF" stroke-width="3" opacity="0.4"/>
  <circle cx="250" cy="220" r="150" fill="none" stroke="#B57BFF" stroke-width="1" opacity="0.2"/>
  <polygon points="250,80 370,180 330,310 170,310 130,180" fill="url(#gem)" filter="url(#glow)" opacity="0.95"/>
  <polygon points="250,80 370,180 250,150" fill="#ffffff" opacity="0.15"/>
  <polygon points="250,150 370,180 330,310 170,310 130,180" fill="#4B1F8E" opacity="0.3"/>
  <ellipse cx="220" cy="155" rx="25" ry="12" fill="#ffffff" opacity="0.25" transform="rotate(-20 220 155)"/>
  <text x="250" y="390" font-family="Arial,sans-serif" font-size="22"
    fill="#B57BFF" text-anchor="middle" letter-spacing="6" opacity="0.9">SOLWATCH</text>
  <text x="250" y="440" font-family="Arial,sans-serif" font-size="32" font-weight="bold"
    fill="#B57BFF" text-anchor="middle" letter-spacing="4" filter="url(#glow)">ODIN</text>
  <line x1="150" y1="455" x2="350" y2="455" stroke="#B57BFF" stroke-width="1" opacity="0.4"/>
  <text x="250" y="475" font-family="Arial,sans-serif" font-size="13"
    fill="#ffffff" text-anchor="middle" opacity="0.4">MYTHIC · DAY 300</text>
</svg>
